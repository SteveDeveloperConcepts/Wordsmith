name: CI

on:
  push:
    branches: [main, initial-build]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v7
        with:
          name: wordsmith-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    name: add-in and extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - run: npm run build:extension
      - uses: actions/upload-artifact@v7
        with:
          name: wordsmith-office-add-in
          path: dist-site/office
      - uses: actions/upload-artifact@v7
        with:
          name: wordsmith-browser-extension
          path: dist-extension
