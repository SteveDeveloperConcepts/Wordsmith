name: CI

on:
  push:
    branches: [main, initial-build]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Electron and electron-builder download their binaries from GitHub releases, which can be slow or
      # time out. With a cache, a build does not depend on those downloads every time.
      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-
      - run: npm run typecheck
      - run: npm test

      # As in the Release workflow: npm installs only this machine's koffi, and one build makes both apps.
      - name: Add the Intel build of koffi
        if: matrix.name == 'macos-arm64'
        run: npm install --no-save --force --ignore-scripts "@koromix/koffi-darwin-x64@$(node -p "require('./node_modules/koffi/package.json').version")"

      - name: Build the installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          case "${{ matrix.name }}" in
            windows-x64) build="npm run dist:win" ;;
            macos-arm64) build="npm run dist:mac -- --x64 --arm64" ;;
            macos-x64) build="npm run dist:mac -- --x64" ;;
          esac
          # A failure also goes on the run's summary, which can be read without signing in.
          set +e
          $build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(grep -v '^[[:space:]]*$' build.log | tail -n 25 | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }')
            echo "::error title=The installer build failed::$message"
            exit "$status"
          fi

      - name: Check the update files were written
        shell: bash
        run: ls release/latest*.yml

      - name: Test the packaged app
        run: npm run test:e2e -- --packaged

      - uses: actions/upload-artifact@v7
        with:
          name: wordsmith-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  update:
    name: windows self-update
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Electron and electron-builder download their binaries from GitHub releases, which can be slow or
      # time out. With a cache, a build does not depend on those downloads every time.
      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-
      - run: npm run test:update

  web:
    runs-on: ubuntu-latest
    name: add-in and extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - run: npm run build:extension
      - uses: actions/upload-artifact@v7
        with:
          name: wordsmith-office-add-in
          path: dist-site/office
      - uses: actions/upload-artifact@v7
        with:
          name: wordsmith-browser-extension
          path: dist-extension
