appId: com.developerconcepts.wordsmith
productName: Wordsmith
copyright: Copyright © 2026 Steve Vaubell

directories:
  output: release
  buildResources: resources

# The bundled app is all that ships. Vite has already folded in every devDependency.
files:
  - out/**/*
  - "!**/*.map"

# koffi loads its native binary from a real file, which cannot live inside an asar archive.
asarUnpack:
  - "**/node_modules/@koromix/**"

extraResources:
  - from: resources
    to: resources
    filter:
      - tray*.png

# koffi ships prebuilt binaries, so there is nothing to compile.
npmRebuild: false

# Where installed copies look for new versions (src/main/updater.ts). Builds upload nothing themselves:
# the Release workflow attaches the latest*.yml and .blockmap files written next to the installers.
publish:
  provider: github
  owner: SteveDeveloperConcepts
  repo: Wordsmith

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # No spaces in release file names: GitHub renames uploads that have them.
  artifactName: Wordsmith-Setup-${version}.${ext}

mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  # The disk image is what people download. Updates install from the zip.
  target:
    - dmg
    - zip
  artifactName: Wordsmith-${version}-${arch}.${ext}
  # Signed with a Developer ID and notarised by the Release workflow (docs/RELEASING.md).
  # electron-builder notarises when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID are set.
  hardenedRuntime: true
  # Word and text editors keep their place as the default app; Wordsmith only appears in Open With.
  fileAssociations:
    - ext: docx
      name: Word document
      role: Editor
      rank: Alternate
    - ext: md
      name: Markdown document
      role: Editor
      rank: Alternate
    - ext: txt
      name: Text document
      role: Editor
      rank: Alternate
